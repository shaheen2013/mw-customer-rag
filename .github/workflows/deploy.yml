name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t mw-customer-rag:${{ steps.meta.outputs.tag }} .

      - name: Export image
        run: docker save mw-customer-rag:${{ steps.meta.outputs.tag }} | gzip > /tmp/mw-customer-rag.tar.gz

      - name: Upload image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: /tmp/mw-customer-rag.tar.gz
          target: /tmp
          overwrite: true

      - name: Deploy (load, swap, health-check, auto-rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            TAG=${{ steps.meta.outputs.tag }}
            IMAGE=mw-customer-rag:$TAG

            echo "Loading image..."
            if ! docker load -i /tmp/mw-customer-rag.tar.gz; then
              echo "FATAL: docker load failed"
              exit 1
            fi

            if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
              echo "FATAL: image $IMAGE not found after load"
              exit 1
            fi

            echo "Stopping old container..."
            docker rm -f mw-customer-rag-old >/dev/null 2>&1 || true
            if [ -n "$(docker ps -aq -f name=^mw-customer-rag$)" ]; then
              docker rename mw-customer-rag mw-customer-rag-old
            fi

            echo "Starting $IMAGE ..."
            docker run -d --name mw-customer-rag \
              --restart unless-stopped \
              -p 127.0.0.1:3024:3000 \
              "$IMAGE"

            echo "Health-checking (up to 60s)..."
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3024/login || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 2
            done

            if [ "$ok" != "1" ]; then
              echo "HEALTH CHECK FAILED — rolling back"
              docker logs --tail 50 mw-customer-rag 2>&1 || true
              docker rm -f mw-customer-rag >/dev/null 2>&1 || true
              if [ -n "$(docker ps -aq -f name=^mw-customer-rag-old$)" ]; then
                docker rename mw-customer-rag-old mw-customer-rag
                docker start mw-customer-rag >/dev/null 2>&1 || true
              fi
              exit 1
            fi

            echo "Cleaning up..."
            docker rm -f mw-customer-rag-old >/dev/null 2>&1 || true
            rm -f /tmp/mw-customer-rag.tar.gz
            docker image prune -f >/dev/null
            echo "DEPLOY OK: $IMAGE"
