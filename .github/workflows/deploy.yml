name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -e
            IMAGE=ghcr.io/${{ github.repository }}:${{ needs.build-and-push.outputs.tag }}

            echo "Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              --username ${{ github.actor }} --password-stdin

            echo "Pulling $IMAGE ..."
            docker pull "$IMAGE"

            echo "Stopping old container (keep for rollback)..."
            if docker ps -a --format '{{.Names}}' | grep -q '^mw-customer-rag-old$'; then
              docker rm mw-customer-rag-old >/dev/null
            fi
            if docker ps -a --format '{{.Names}}' | grep -q '^mw-customer-rag$'; then
              docker rename mw-customer-rag mw-customer-rag-old
            fi

            echo "Starting new container..."
            docker run -d --name mw-customer-rag \
              --restart unless-stopped \
              -p 127.0.0.1:3024:3000 \
              "$IMAGE"

            echo "Health-checking (30 attempts, 2s apart)..."
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3024/login || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 2
            done

            if [ "$ok" != "1" ]; then
              echo "HEALTH CHECK FAILED — rolling back"
              docker logs --tail 50 mw-customer-rag || true
              docker rm -f mw-customer-rag >/dev/null || true
              if docker ps -a --format '{{.Names}}' | grep -q '^mw-customer-rag-old$'; then
                docker rename mw-customer-rag-old mw-customer-rag
                docker start mw-customer-rag >/dev/null
              fi
              exit 1
            fi

            echo "Cleaning up..."
            docker rm -f mw-customer-rag-old >/dev/null 2>&1 || true
            docker image prune -f >/dev/null
            echo "Deploy OK: $IMAGE"
