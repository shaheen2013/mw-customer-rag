name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://customer.mediusware.com \
            -t mw-customer-rag:${{ steps.meta.outputs.tag }} .

      - name: Export image
        run: docker save mw-customer-rag:${{ steps.meta.outputs.tag }} | gzip > /tmp/mw-customer-rag.tar.gz

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload image to server
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" scp -O \
            -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            /tmp/mw-customer-rag.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/"

      - name: Deploy (load, swap, health-check, auto-rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          script: |
            TAG=${{ steps.meta.outputs.tag }}
            SHA=${{ github.sha }}
            IMAGE=mw-customer-rag:$TAG

            TAR=/tmp/mw-customer-rag.tar.gz
            [ -f "$TAR" ] || TAR=/tmp/tmp/mw-customer-rag.tar.gz
            if [ ! -f "$TAR" ]; then
              echo "FATAL: tarball missing on server"
              exit 1
            fi

            echo "Loading image..."
            if ! docker load -i "$TAR"; then
              echo "FATAL: docker load failed"
              exit 1
            fi

            if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
              echo "FATAL: image $IMAGE not found after load"
              exit 1
            fi

            echo "Stopping old container (frees port)..."
            docker rm -f mw-customer-rag-old >/dev/null 2>&1 || true

            # Stop and remove any other container holding port 3024 (e.g. from docker-compose)
            for cid in $(docker ps -q --filter "publish=3024"); do
              cname=$(docker inspect --format '{{.Name}}' "$cid" 2>/dev/null | sed 's/^\///')
              if [ "$cname" != "mw-customer-rag" ]; then
                echo "Stopping conflicting container on port 3024: $cname ($cid)"
                docker stop "$cid" >/dev/null 2>&1 || true
                docker rm -f "$cid" >/dev/null 2>&1 || true
              fi
            done

            if [ -n "$(docker ps -aq -f name=^mw-customer-rag$)" ]; then
              docker stop mw-customer-rag >/dev/null
              docker rename mw-customer-rag mw-customer-rag-old
            fi

            echo "Starting $IMAGE ..."
            if ! docker run -d --name mw-customer-rag \
              --restart unless-stopped \
              -p 127.0.0.1:3024:3000 \
              "$IMAGE"; then
              echo "CONTAINER START FAILED — rolling back"
              docker rm -f mw-customer-rag >/dev/null 2>&1 || true
              if [ -n "$(docker ps -aq -f name=^mw-customer-rag-old$)" ]; then
                docker rename mw-customer-rag-old mw-customer-rag
                docker start mw-customer-rag >/dev/null
              fi
              exit 1
            fi

            running_image=$(docker inspect mw-customer-rag --format '{{.Config.Image}}')
            if [ "$running_image" != "$IMAGE" ]; then
              echo "FATAL: wrong image running ($running_image) — rolling back"
              docker rm -f mw-customer-rag >/dev/null 2>&1 || true
              docker rename mw-customer-rag-old mw-customer-rag 2>/dev/null || true
              docker start mw-customer-rag >/dev/null 2>&1 || true
              exit 1
            fi

            echo "Health-checking (up to 60s)..."
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3024/login || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 2
            done

            if [ "$ok" != "1" ]; then
              echo "HEALTH CHECK FAILED — rolling back"
              docker logs --tail 50 mw-customer-rag 2>&1 || true
              docker rm -f mw-customer-rag >/dev/null 2>&1 || true
              if [ -n "$(docker ps -aq -f name=^mw-customer-rag-old$)" ]; then
                docker rename mw-customer-rag-old mw-customer-rag
                docker start mw-customer-rag >/dev/null
              fi
              exit 1
            fi

            echo "Cleaning up (THIS project only — nothing else touched)..."
            docker rm -f mw-customer-rag-old >/dev/null 2>&1 || true
            for img in $(docker images --format '{{.Repository}}:{{.Tag}}' mw-customer-rag | grep -v "^$IMAGE$"); do
              docker rmi "$img" >/dev/null 2>&1 || true
            done
            rm -f /tmp/mw-customer-rag.tar.gz /tmp/tmp/mw-customer-rag.tar.gz 2>/dev/null || true
            rmdir /tmp/tmp 2>/dev/null || true

            echo "Syncing latest code checkout on server..."
            if [ ! -d /root/projects/mw-customer-rag/.git ]; then
              git clone --quiet https://github.com/shaheen2013/mw-customer-rag.git /root/projects/mw-customer-rag
            fi
            cd /root/projects/mw-customer-rag
            git fetch --quiet origin main
            git checkout --quiet --detach "$SHA"
            echo "Server checkout at: $(git rev-parse --short HEAD)"

            echo "DEPLOY OK: $IMAGE"
